server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain text/xml application/xml application/javascript image/svg+xml;

    # Cabeçalhos de segurança (definidos só aqui para valerem em todas as rotas;
    # as locations abaixo usam "expires" em vez de add_header para não anulá-los)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # HSTS: o HTTPS é terminado no proxy do Easypanel; o navegador só aceita este cabeçalho via HTTPS
    add_header Strict-Transport-Security "max-age=31536000" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Imagens, ícones e fonte: cache de 7 dias
    location ~* \.(webp|jpg|jpeg|png|svg|ico|woff2)$ {
        expires 7d;
        try_files $uri =404;
    }

    # HTML sempre revalidado após deploy
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }
}
