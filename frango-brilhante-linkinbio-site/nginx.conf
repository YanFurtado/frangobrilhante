server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    # Cabeçalhos de segurança (definidos só aqui para valerem em todas as rotas;
    # as locations abaixo usam "expires" em vez de add_header para não anulá-los)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Imagens e ícones: cache de 7 dias
    location ~* \.(webp|jpg|jpeg|png|svg|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    # HTML sempre revalidado após deploy
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }
}
